[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "2.0.0-dev"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/laraXgram/Simula"

[workspace.dependencies]
simula-tl = { path = "crates/tl" }

base64 = "0.23"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev]
# Generated TL code is large; keep debug info light so builds stay small on disk.
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
